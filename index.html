<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니게임천국</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Pretendard, sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
}

header{
    background:#4CAF50;
    color:white;
    text-align:center;
    padding:70px 20px;
}

header h1{
    font-size:48px;
}

header p{
    margin-top:15px;
    font-size:20px;
}

section{
    max-width:1100px;
    margin:auto;
    padding:60px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
    color:#4CAF50;
    margin-bottom:10px;
}

button{
    margin-top:20px;
    background:#4CAF50;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
}
</style>

</head>
<body>

<header>
<h1>🎲 미니게임천국</h1>
<p>3~5분이면 즐기는 최고의 보드게임 컬렉션</p>
</header>

<section>
<h2>게임 소개</h2>
<br>

<div class="cards">

<div class="card">
<h3>🧠 기억력 게임</h3>
<p>숫자와 색을 기억하며 협력하는 초간단 메모리 게임.</p>
</div>

<div class="card">
<h3>⚡ 순발력 게임</h3>
<p>빠르게 판단하고 가장 먼저 행동하세요.</p>
</div>

<div class="card">
<h3>🤝 협력 게임</h3>
<p>모두가 힘을 합쳐 제한시간 안에 미션을 해결합니다.</p>
</div>

<div class="card">
<h3>🎉 파티 게임</h3>
<p>가족, 친구 누구나 웃으며 즐길 수 있는 게임.</p>
</div>

</div>

<center>
<button onclick="alert('곧 다양한 보드게임이 추가됩니다!')">
게임 더 보기
</button>
</center>

</section>

<section>

<h2>게임 특징</h2>

<ul style="margin-top:20px;line-height:2;">
<li>✅ 3~8명 플레이 가능</li>
<li>✅ 게임당 3~5분</li>
<li>✅ 배우기 쉬운 규칙</li>
<li>✅ 남녀노소 누구나 가능</li>
</ul>

</section>

<footer>

<h3>미니게임천국</h3>
<p>© 2026 Mini Game World</p>

</footer>

</body>
</html>
